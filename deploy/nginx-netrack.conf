# NetRack DCIM - Nginx VirtualHost Configuration
# Posiziona questo file in: /etc/nginx/sites-available/netrack-dcim
# Poi abilita con: sudo ln -s /etc/nginx/sites-available/netrack-dcim /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name dcim.example.corp; # Sostituisci con il tuo FQDN o IP del server

    root /var/www/netrack-dcim/dist;
    index index.html;

    # Compressione Gzip per massime prestazioni di caricamento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Gestione routing SPA Vite / React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching asset statici
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security Headers standard enterprise
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Log personalizzati
    access_log /var/log/nginx/netrack_dcim_access.log;
    error_log /var/log/nginx/netrack_dcim_error.log warn;
}
